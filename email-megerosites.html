<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#174632">
  <title>E-mail-cím megerősítése · Növényfigyelő</title>
  <link rel="icon" href="/pwa-icon-192.png">
  <link rel="stylesheet" href="/email-megerosites.css">
  <script type="module" src="/email-megerosites.js"></script>
</head>
<body>
  <main class="verification">
    <header class="brand">
      <img src="/pwa-icon-192.png" width="44" height="44" alt="">
      <span>Növényfigyelő</span>
    </header>
    <section class="card" aria-labelledby="heading">
      <h1 id="heading">E-mail-cím megerősítése</h1>
      <p id="message" role="status">A megerősítő link ellenőrzése…</p>
      <button id="confirm" type="button" hidden>E-mail-cím megerősítése</button>
      <a id="home" href="/">Vissza a Növényfigyelőbe</a>
      <noscript><p>A megerősítéshez engedélyezd a JavaScriptet a böngésződben.</p></noscript>
    </section>
  </main>

</html>
